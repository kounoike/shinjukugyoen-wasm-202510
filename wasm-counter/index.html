<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wasm Counter Demo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            padding: 2rem;
            font-size: 200%;
        }

        button {
            margin: .5rem 0;
            font-size: 100%;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Wasm Counter Demo</h1>

    <div>
        Counter1 Count: <strong><span id="count1">—</span></strong>
        Address: <span id="addr1">—</span>
        <button id="inc1">Increment</button>
    </div>

    <div>
        Counter2 Count: <strong><span id="count2">—</span></strong>
        Address: <span id="addr2">—</span>
        <button id="inc2">Increment</button>
    </div>

    <div>
        <div>
            <button id="sync-partial">Copy Counter value Counter1 -> Counter2</button>
        </div>
        <div>
            <button id="sync-all">Sync All memory Counter1 -> Counter2</button>
        </div>
    </div>

    <div id="status" style="margin-top:1rem;color:gray"></div>

    <script src="wasm-counter.js"></script>
</body>

</html>
